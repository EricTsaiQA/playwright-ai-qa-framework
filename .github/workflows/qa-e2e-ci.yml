name: Playwright + AI Self-Healing QA Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qa-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic & Self-Healing QA Unit/Integration Suite
        run: |
          pytest -v

      - name: Upload QA Acceptance Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-acceptance-report
          path: docs/SAMPLE_QA_ACCEPTANCE_REPORT.md
